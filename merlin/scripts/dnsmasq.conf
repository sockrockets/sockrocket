# Sockrocket dnsmasq configuration template for AsusWRT-Merlin
# Placed in /jffs/configs/dnsmasq.d/sockrocket.conf
# Generated by sockrocket.sh — do not edit manually, changes will be overwritten.
#
# Strategy: the firmware's servers-file upstreams (ISP DNS) are replaced by
#           Sockrocket's DNS listener (see sockrocket.sh pin_dns_upstream — the ISP servers
#           otherwise race the proxied answers and their GFW-poisoned replies
#           win). This listener is the ONLY upstream: it resolves China
#           domains via domestic resolvers and answers international names
#           from the fake-IP pool (TUN mode), so nothing on the LAN ever
#           talks to ISP DNS. The old dns_direct_domains bypass was removed
#           : bypassed names never reached Sockrocket's domestic-IP
#           table, so geoip misses misrouted their bare-IP TUN traffic into
#           the proxy (a domestic-site misroute), and user routing rules could
#           never match them.
#
# __DNS_PORT__ → replaced with actual DNS port (from config, default 5300)
# __ROUTER_IP__ → replaced with LAN gateway IP

# ── DNS security ──────────────────────────────────────────────────────────────
# NOTE: no-resolv / bogus-priv / domain-needed / cache-size are ALREADY set in
# the firmware's own /etc/dnsmasq.conf, and this file is pulled in alongside it
# via that config's `conf-dir=/jffs/configs/dnsmasq.d` line. dnsmasq rejects
# the *whole* configuration on a repeated keyword ("illegal repeated keyword"),
# so restating any of them here makes dnsmasq refuse to start — which takes
# every DNS lookup on the LAN down with it. Only settings the firmware does
# NOT already define belong below.
stop-dns-rebind      # Block DNS rebinding attacks
rebind-localhost-ok  # Allow 127.x.x.x rebind responses (needed for some tools)

# ── Cache settings ────────────────────────────────────────────────────────────
# cache-size is intentionally NOT set here — the firmware already defines it.
# min-cache-ttl must stay BELOW Sockrocket's own answer TTLs (fake-IP answers: 5s;
# domestic real answers: 30s) — clamping them to 60s served stale fake
# addresses for up to a minute after a daemon restart, with no pool mapping
# left to honor them.
min-cache-ttl=5
# max-cache-ttl=3600

# ── Default upstream: Sockrocket internal DNS ────────────────────────────────────────
server=127.0.0.1#__DNS_PORT__

# ── Local / router domains bypass ─────────────────────────────────────────────
server=/local/
server=/router.asus.com/__ROUTER_IP__
address=/router.asus.com/__ROUTER_IP__

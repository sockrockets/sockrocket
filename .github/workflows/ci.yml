name: CI

on:
  push:
    branches: ["main", "master", "dev", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "master", "dev"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            clang \
            mold

      # ── macOS system dependencies ──────────────────────────────────────────
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      # ── Windows: locate fxc.exe for GPUI HLSL shader compilation ───────────
      - name: Set GPUI_FXC_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "fxc.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $fxc) {
            Write-Error "fxc.exe not found in Windows Kits"
            exit 1
          }
          echo "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          Write-Host "Found fxc.exe: $($fxc.FullName)"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build (CLI)
        run: cargo build --package sockrocket-cli --target ${{ matrix.target }}

      - name: Build (GUI)
        # GUI may not build headlessly on Linux CI; mark as allowed to fail
        continue-on-error: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: cargo build --package sockrocket-gui --target ${{ matrix.target }}

      - name: Build (GUI Release, Windows only)
        if: runner.os == 'Windows'
        run: cargo build --package sockrocket-gui --release --target ${{ matrix.target }}

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run tests
        run: cargo test --workspace --target ${{ matrix.target }}

      # ── Collect artifacts ──────────────────────────────────────────────────
      - name: Collect CLI binary
        shell: bash
        run: |
          EXT=""
          [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          mkdir -p dist
          cp target/${{ matrix.target }}/debug/sockrocket-cli${EXT} \
             dist/sockrocket-cli-${{ matrix.artifact }}${EXT}

      - name: Collect GUI binary (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/sockrocket.exe \
             dist/sockrocket-${{ matrix.artifact }}.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sockrocket-cli-${{ matrix.artifact }}
          path: dist/sockrocket-cli-${{ matrix.artifact }}*
          retention-days: 7

      - name: Upload GUI artifact (Windows only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sockrocket-${{ matrix.artifact }}
          path: dist/sockrocket-${{ matrix.artifact }}.exe
          retention-days: 7

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libgl1-mesa-dev \
            libasound2-dev libfontconfig1-dev \
            libfreetype6-dev pkg-config clang
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Merlin Router cross-compile check ────────────────────────────────────────
  merlin:
    # Explicit name avoids GitHub appending the full Rust triple
    # (…-unknown-linux-musl) into the Actions UI job title.
    name: Merlin binaries (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            target: aarch64-unknown-linux-musl
          - name: armv7hf
            target: armv7-unknown-linux-musleabihf
          - name: armv7sf
            target: armv7-unknown-linux-musleabi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: merlin-${{ matrix.name }}

      # Skip the expensive cross build unless code that lands in the Merlin
      # plugin (or the plugin packaging itself) changed.
      - name: Detect Merlin-relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            merlin:
              - 'crates/sockrocket-core/**'
              - 'crates/sockrocket-cli/**'
              - 'crates/craftls/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'merlin/**'

      - name: Install cross
        if: steps.changes.outputs.merlin == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-compile CLI (${{ matrix.name }})
        if: steps.changes.outputs.merlin == 'true'
        run: cross build --release --package sockrocket-cli --target ${{ matrix.target }}

      - name: Upload binary artifact
        if: steps.changes.outputs.merlin == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-merlin-bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/sockrocket-cli
          retention-days: 7

  merlin-pack:
    name: Merlin packages
    needs: merlin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect Merlin-relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            merlin:
              - 'crates/sockrocket-core/**'
              - 'crates/sockrocket-cli/**'
              - 'crates/craftls/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'merlin/**'

      - name: Download aarch64 binary
        if: steps.changes.outputs.merlin == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-merlin-bin-aarch64
          path: target/aarch64-unknown-linux-musl/release

      - name: Download armv7hf binary
        if: steps.changes.outputs.merlin == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-merlin-bin-armv7hf
          path: target/armv7-unknown-linux-musleabihf/release

      - name: Download armv7sf binary
        if: steps.changes.outputs.merlin == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-merlin-bin-armv7sf
          path: target/armv7-unknown-linux-musleabi/release

      - name: Pack all platforms
        if: steps.changes.outputs.merlin == 'true'
        run: |
          chmod +x target/aarch64-unknown-linux-musl/release/sockrocket-cli
          chmod +x target/armv7-unknown-linux-musleabihf/release/sockrocket-cli
          chmod +x target/armv7-unknown-linux-musleabi/release/sockrocket-cli
          ./merlin/pack.sh

      - name: Upload Merlin plugin artifacts
        if: steps.changes.outputs.merlin == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sockrocket-merlin-all
          path: dist/merlin/*
          retention-days: 14

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

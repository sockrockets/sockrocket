name: Merlin Package (on demand)

# Manually triggered Merlin router plugin build. Cross-compiles CLI for
# Cross-compile aarch64 + armv7 (hardfloat + softfloat), then packs all
# koolcenter platform tarballs via merlin/pack.sh. Artifacts are downloadable from the
# workflow run; optionally attached to a GitHub release.

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach assets to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to attach assets to (created if missing)"
        type: string
        default: "merlin-nightly"
      prerelease:
        description: "Mark the attached release as a prerelease"
        type: boolean
        default: true

permissions:
  contents: write # needed when attach_to_release is enabled

jobs:
  merlin:
    # Explicit name avoids GitHub appending the full Rust triple
    # (…-unknown-linux-musl) into the Actions UI job title.
    name: Merlin binaries (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            target: aarch64-unknown-linux-musl
          - name: armv7hf
            target: armv7-unknown-linux-musleabihf
          - name: armv7sf
            target: armv7-unknown-linux-musleabi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: merlin-${{ matrix.name }}-dispatch

      - name: Install cross-compilation toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-compile CLI (${{ matrix.name }})
        run: cross build --package sockrocket-cli --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlin-bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/sockrocket-cli
          retention-days: 14

  pack:
    name: Merlin packages
    needs: merlin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: merlin-bin-aarch64
          path: target/aarch64-unknown-linux-musl/release

      - name: Download armv7hf binary
        uses: actions/download-artifact@v4
        with:
          name: merlin-bin-armv7hf
          path: target/armv7-unknown-linux-musleabihf/release

      - name: Download armv7sf binary
        uses: actions/download-artifact@v4
        with:
          name: merlin-bin-armv7sf
          path: target/armv7-unknown-linux-musleabi/release

      - name: Make binaries executable
        run: |
          chmod +x target/aarch64-unknown-linux-musl/release/sockrocket-cli
          chmod +x target/armv7-unknown-linux-musleabihf/release/sockrocket-cli
          chmod +x target/armv7-unknown-linux-musleabi/release/sockrocket-cli

      - name: Pack all platforms
        run: ./merlin/pack.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sockrocket-merlin-all
          path: dist/merlin/*
          retention-days: 90

      - name: Attach assets to release
        if: ${{ inputs.attach_to_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/merlin/*
          fail_on_unmatched_files: true
          generate_release_notes: false

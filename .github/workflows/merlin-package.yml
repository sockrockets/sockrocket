name: Correct v0.1.1 release metadata
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Update release notes and latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/e3491819d1f5f2df688d86298b54ecfb04986a48" --jq .object.sha)" = 184d37dfe0604d32e4f1820e3dc340ded055b444
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          case "$latest" in v0.1.0|v0.1.1) ;; *) exit 1;; esac
          cat > notes.md <<'NOTES'
          ## Sockrocket v0.1.1

          Built from commit 184d37d, including pull requests #32 and #33.

          - Improve TCP upload reassembly and receive-window handling in TUN mode.
          - Handle fragmented TLS records in VLESS Vision and expire idle WebSocket preconnections earlier.
          - On Merlin, expire stale low TCP thresholds for configured IPv4 proxy endpoints and align the domestic IP bypass control with routing mode.

          For RT-AX86U Pro, install `sockrocket-merlin-hnd_v8.tar.gz`. Check the package against `SHA256SUMS-merlin.txt`.
          NOTES
          gh release edit v0.1.1 --repo "$GITHUB_REPOSITORY" --latest --notes-file notes.md
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = v0.1.1

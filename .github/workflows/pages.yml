name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "crates/sockrocket-gui/assets/logo*.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p docs/site/assets
          cp crates/sockrocket-gui/assets/logo*.svg docs/site/assets/
          cp crates/sockrocket-gui/assets/icon*.png docs/site/assets/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

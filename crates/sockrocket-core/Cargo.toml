[package]
name = "sockrocket-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forward tracing events to an externally installed log logger in library applications.
default = ["log-fallback"]
log-fallback = ["quinn/log"]

[dependencies]
blake3 = "1.8"
ctr = "0.9"
ml-kem = "0.2.3"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
parking_lot = "0.12"
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio-wireguard = { path = "../../vendor/tokio-wireguard" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
lru = { workspace = true }
socket2 = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
craft-tls = { workspace = true }
craftls = { package = "rustls", version = "0.22.4", default-features = false, features = ["lazy-fingerprint-sets"] }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hex = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
crc32fast = { workspace = true }
chacha20poly1305 = { workspace = true }
shadowsocks = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
qrcode = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
tokio-util = { version = "0.7", features = ["codec","io","io-util"] }
h2 = "0.4.13"
hyper = { version = "1.9", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sysproxy = { workspace = true }
tun = { workspace = true }
ipstack = { workspace = true }
etherparse = { workspace = true }

[dev-dependencies]
log = { workspace = true }
# Independent ML-KEM/HRR server fixtures require aws-lc, not the production
# client. Resolver v2 keeps this backend out of release CLI dependencies.
rustls = { workspace = true, features = ["aws_lc_rs", "prefer-post-quantum"] }
tokio = { workspace = true, features = ["test-util"] }

# Windows: tolerant reading of the proxy registry keys (and PAC cleanup)
# that sysproxy 0.3.0 cannot parse. Same major version sysproxy uses.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10"

# (musl cross-compilation used to add `openssl = { features = ["vendored"] }`
# here for pkg-config-free builds. Removed: reqwest is now rustls-only
# (default-features = false in the workspace manifest), so nothing in the
# dependency graph links OpenSSL anymore.)

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"

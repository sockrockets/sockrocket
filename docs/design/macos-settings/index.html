function nodesContent(){return '<p class="subtitle">选一个节点用于手动出口；自动策略在“策略组”中管理。</p>'+`<div class="selection-summary"><span class="summary-icon">${icon('globe')}</span><span><small>当前节点</small><b>${esc(state.node||'尚未选择')}</b></span><span class="latency">${selectedLatency()}</span>${act('nav','管理策略组','groups')}</div><div class="toolbar"><input aria-label="搜索节点" placeholder="搜索名称、地区或协议" data-search="node" value="${esc(state.nodeQuery)}">${act('test-nodes',state.nodeTesting?'测速中…':'测速')}${act('import','＋ 添加','','primary')}</div><div class="filter-line"><select id="node-source" aria-label="节点来源">${['全部来源',...new Set(state.nodes.map(n=>nodeSources.get(n[0])||'手动添加'))].map(s=>`<option ${s===state.nodeSourceFilter?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="node-sort" aria-label="排序">${['延迟优先','名称排序','收藏优先'].map(s=>`<option ${s===state.nodeSort?'selected':''}>${s}</option>`).join('')}</select><label><input type="checkbox" id="node-favorites" ${state.favoritesOnly?'checked':''}> 仅收藏</label><span>${visibleNodes().length} / ${state.nodes.length} 个节点</span></div><div class="group" id="node-list">${nodeRows()}</div><div class="list-caption"><span>延迟测试 · ${state.testedAt}</span><span>毫秒为延迟，不代表下载带宽</span></div>`+group('管理',row('订阅来源',state.subs.length+' 个来源','nav','subscriptions')+row('导出与分享','分享链接与本地订阅','share'))+help('点击节点即选中；“详情”不会切换。切换仅影响后续新连接。');}

function groupsContent(){return '<p class="subtitle">规则指向策略组，由策略决定实际使用哪个成员节点。</p>'+`<div class="toolbar">${act('group','＋ 新建策略组','new','primary')}</div><div class="group">${state.groups.map(g=>`<button class="row strategy-row" data-act="group" data-value="${esc(g.id)}"><span class="strategy-icon">${icon(g.policy==='故障切换'?'nav-connections':g.policy==='URL 测速'?'bolt':'nav-nodes')}</span><span class="strategy-label"><b>${esc(g.name)}</b><small>${esc(g.policy)} · ${g.members.filter(name=>state.nodes.some(n=>n[0]===name)).length} 个有效成员${g.members.some(name=>!state.nodes.some(n=>n[0]===name))?' · 部分成员已失效':''}</small></span><span class="value">${esc(groupPick(g)||'暂无可用节点')} <span class="chev">›</span></span></button>`).join('')}</div>`+group('检测设置',toggle('自动检测可用性','health','与内核健康检查保持一致')+row('检测间隔与阈值','全局检测参数','health-settings'))+`<div class="policy-explain"><div><b>手动选择</b><p>固定使用选中的成员。</p></div><div><b>URL 测速</b><p>按最近有效延迟选择较快成员。</p></div><div><b>故障切换</b><p>按成员顺序选择首个可用节点。</p></div></div>`+help('此处结果为示例。未测速不等于不可用；正式界面应同时显示探测失败与未检测状态。');}
function editGroup(id){const g=state.groups.find(g=>g.id===id)||{id:'new',name:'新策略组',policy:'手动选择',members:state.nodes.slice(0,1).map(n=>n[0]),pick:state.nodes[0]?.[0]};modal(id==='new'?'新建策略组':'编辑策略组',field('名称','group-name',g.name)+select('策略','group-policy',['手动选择','URL 测速','故障切换'],g.policy)+help('故障切换按下面的成员顺序选择首个可用节点；当前仅支持节点成员，不支持嵌套组。')+`<h2>成员节点</h2><div class="group">${[...g.members.filter(name=>state.nodes.some(n=>n[0]===name)),...state.nodes.map(n=>n[0]).filter(name=>!g.members.includes(name))].map(name=>`<label class="row"><span>${esc(name)}</span><input type="checkbox" name="members" ${g.members.includes(name)?'checked':''} value="${esc(name)}"></label>`).join('')}</div>`+select('手动选中','group-picked',state.nodes.map(n=>n[0]),g.pick)+help('测速目标、间隔和失败阈值统一在全局健康检查中管理。'),[['close','取消'],['save-group','保存',id,'primary']]);}
function saveGroup(id){const name=$('#group-name').value.trim(),policy=$('#group-policy').value,members=[...document.querySelectorAll('[name=members]:checked')].map(n=>n.value),pick=$('#group-picked').value;if(!name||!members.length){$('#dialog-error').textContent='请填写名称并选择至少一个成员。';return;}if(state.groups.some(g=>g.id!==id&&g.name===name)||['代理','直连','拒绝','PROXY','DIRECT','REJECT'].includes(name)){$('#dialog-error').textContent='名称已存在或属于保留出口，请使用其他名称。';return;}if(policy==='手动选择'&&!members.includes(pick)){$('#dialog-error').textContent='手动选中的节点必须包含在成员中。';return;}const existing=state.groups.find(g=>g.id===id);if(existing&&existing.name!==name){state.rules.forEach(r=>{if(r[3]===existing.name)r[3]=name;});if(state.finalAction===existing.name)state.finalAction=name;state.ruleUndo=null;}const entry={id:existing?.id||'group-'+(state.groups.length+1),name,policy,members,pick};if(existing)state.groups[state.groups.indexOf(existing)]=entry;else state.groups.push(entry);state.groupName=state.groups[0].name;state.groupPolicy=state.groups[0].policy;close();render();toast('策略组已保存，关联规则已同步');}

async function productAction(a,v,b){
if(a==='update-subs'||a==='retry-sub'){const indices=a==='update-subs'?state.subs.map((_,i)=>i):[Number(v)];if(indices.some(i=>state.subUpdates.has(i)))return true;indices.forEach(i=>state.subUpdates.add(i));state.updates=state.subUpdates.size>0;render();setTimeout(()=>{indices.forEach(i=>{if(state.subs[i])state.subs[i][2]='刚刚';state.subUpdates.delete(i);});state.updates=state.subUpdates.size>0;render();toast('所选订阅已更新（演示）');},900);return true;}
if(a==='group'){editGroup(v);return true;}
if(a==='save-group'){saveGroup(v);return true;}
  if(a==='favorite-node'){state.favorites.has(v)?state.favorites.delete(v):state.favorites.add(v);render();return true;}
  if(a==='reset-node-filters'){state.nodeQuery='';state.nodeSourceFilter='全部来源';state.favoritesOnly=false;render();return true;}
  if(a==='test-nodes'){
    if(state.nodeTesting)return true;state.nodeTesting=true;render();
    setTimeout(()=>{state.nodes=state.nodes.map((n,i)=>[n[0],n[1],[36,82,108,210][i%4]]);state.nodeTesting=false;state.testedAt='刚刚（示例结果）';render();toast('延迟测试完成；实际速度还取决于目标与带宽');},900);return true;
  }
  if(a==='diagnostics'){diagnostics();return true;}
  if(a==='diagnostic-logs'){close();state.page='logs';render();return true;}
  if(a==='diagnostic-rules'){close();await run('rule-test','',b);return true;}
  if(a==='enable-system'){if(!state.connected){toast('请先开启连接');return true;}state.system=true;render();toast('已开启系统代理（演示）');return true;}
  if(a==='rules-undo'){undoRules();return true;}
  if(a==='discard-nav'){Object.assign(state,state.lastApplied);state.dirty=false;close();state.page=v;render();return true;}
  return false;
}

const field=(label,id,value='',type='text')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`;

async function run(a,v,b){

if(a==='test-nodes'){b.disabled=true;b.textContent='测速中…';setTimeout(()=>{state.nodes=state.nodes.map((n,i)=>[n[0],n[1],[36,82,108,210][i%4]]);render();toast('测速完成（示例结果）')},900);}
